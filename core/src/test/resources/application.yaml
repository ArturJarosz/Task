spring:
  datasource:
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    # keep the PostgreSQL version in sync with the database image in docker/docker-compose-*.yml
    url: jdbc:tc:postgresql:18.6:///test
    username: test
    password: test
  jpa:
    open-in-view: false
    hibernate:
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
  liquibase:
    enabled: true
    change-log: database/changelogs/changelog-master.yml
    default-schema: public
server:
  port: 9565
task:
  language: en
  encoding: UTF-8
  security:
    allowed-origins:
      - "localhost"
  project:
    active-statuses:
      - TO_DO
      - IN_PROGRESS
  configuration:
    default-values:
      vat-tax: 0.23
      income-tax: 0.18
      theme-color: "#465fff"
