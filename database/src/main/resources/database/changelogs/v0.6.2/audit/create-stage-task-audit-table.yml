databaseChangeLog:
  - changeSet:
      author: "liquibase"
      id: "create-stage-task-audit-table"
      changes:
        - createTable:
            tableName: "STAGE_TASK_AUD"
            columns:
              - column:
                  name: "REV"
                  type: "${integer.type}"
                  constraints:
                    nullable: false
              - column:
                  name: "REVTYPE"
                  type: "${integer.type}"
              - column:
                  name: "STAGE_ID"
                  type: "${long.type}"
                  constraints:
                    nullable: false
              - column:
                  name: "TASK_ID"
                  type: "${long.type}"
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: "STAGE_TASK_AUD"
            columnNames: "REV, STAGE_ID, TASK_ID"
            constraintName: "PK_STAGE_TASK_AUD"
        - addForeignKeyConstraint:
            baseTableName: "STAGE_TASK_AUD"
            baseColumnNames: "REV"
            referencedTableName: "REVINFO"
            referencedColumnNames: "REV"
            constraintName: "STAGE_TASK_AUD_REV_FK"
