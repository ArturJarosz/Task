databaseChangeLog:
  - changeSet:
      author: "liquibase"
      id: "create-contractor-category-name-unique-index"
      changes:
        # Names are unique regardless of letter case, as the application checks them
        - sql:
            dbms: "postgresql"
            sql: "create unique index UK_CONTRACTOR_CATEGORY_NAME on CONTRACTOR_CATEGORY (lower(NAME))"
  - changeSet:
      author: "liquibase"
      id: "create-contractor-category-index"
      changes:
        - createIndex:
            tableName: "CONTRACTOR"
            indexName: "IDX_CONTRACTOR_CATEGORY_ID"
            columns:
              - column:
                  name: "CATEGORY_ID"
