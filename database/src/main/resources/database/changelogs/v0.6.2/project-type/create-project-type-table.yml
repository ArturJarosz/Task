databaseChangeLog:
  - changeSet:
      author: "liquibase"
      id: "create-project-type-table"
      changes:
        - createTable:
            tableName: "PROJECT_TYPE"
            columns:
              - column:
                  name: "ID"
                  type: "${long.type}"
                  constraints:
                    nullable: false
              - column:
                  name: "UUID"
                  type: "UUID"
                  constraints:
                    nullable: false
              - column:
                  name: "NAME"
                  type: "VARCHAR2(100 ${char.unit})"
                  constraints:
                    nullable: false
              - column:
                  name: "CREATED_DATETIME"
                  type: "TIMESTAMP"
              - column:
                  name: "LAST_MODIFIED_DATETIME"
                  type: "TIMESTAMP"
        - addPrimaryKey:
            tableName: "PROJECT_TYPE"
            columnNames: "ID"
            constraintName: "PK_PROJECT_TYPE"
