databaseChangeLog:
  - changeSet:
      author: "liquibase"
      id: "add-release-note-ta-531"
      # Databases made before the ticket was known have the note from the changeset of the old id
      preConditions:
        - onFail: "MARK_RAN"
        - not:
            - changeSetExecuted:
                id: "add-release-note-ta-xxx"
                author: "liquibase"
                changeLogFile: "database/changelogs/v0.6.2/release-note/add-release-note-ta-xxx.yml"
      changes:
        - insert:
            tableName: "RELEASE_NOTE"
            columns:
              - column:
                  name: "ID"
                  valueSequenceNext: "release_note_sequence"
              - column:
                  name: "UUID"
                  valueComputed: "${uuid.function}"
              - column:
                  name: "TICKET"
                  value: "TA-531"
              - column:
                  name: "TYPE"
                  value: "NEW"
              - column:
                  name: "TITLE"
                  value: "Set up roles and permissions"
              - column:
                  name: "DESCRIPTION"
                  value: "Under Settings, Roles, create roles and pick their permissions, then give people their roles under Settings, Users. The Administrator role always has every permission."
              - column:
                  name: "APPLICATION_VERSION"
                  value: "0.6.2"
              - column:
                  name: "CREATED_DATETIME"
                  valueComputed: "now()"
