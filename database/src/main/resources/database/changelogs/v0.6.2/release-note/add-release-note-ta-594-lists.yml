databaseChangeLog:
  - changeSet:
      author: "liquibase"
      id: "add-release-note-ta-594-lists"
      changes:
        - insert:
            tableName: "RELEASE_NOTE"
            columns:
              - column:
                  name: "ID"
                  valueSequenceNext: "release_note_sequence"
              - column:
                  name: "UUID"
                  valueComputed: "${uuid.function}"
              - column:
                  name: "TICKET"
                  value: "TA-594"
              - column:
                  name: "TYPE"
                  value: "IMPROVED"
              - column:
                  name: "TITLE"
                  value: "Shorter add buttons, shaded initials and more compact tables"
              - column:
                  name: "DESCRIPTION"
                  value: "Buttons that add something now say New, as the page, card or tab already shows what you're adding. Clients' initials come in shades of orange and architects' in shades of blue, each person keeping theirs on every page, and table rows take less space."
              - column:
                  name: "APPLICATION_VERSION"
                  value: "0.6.2"
              - column:
                  name: "CREATED_DATETIME"
                  valueComputed: "now()"
