databaseChangeLog:
  - changeSet:
      author: "liquibase"
      id: "add-release-note-ta-594-dark-theme"
      changes:
        - insert:
            tableName: "RELEASE_NOTE"
            columns:
              - column:
                  name: "ID"
                  valueSequenceNext: "release_note_sequence"
              - column:
                  name: "UUID"
                  valueComputed: "${uuid.function}"
              - column:
                  name: "TICKET"
                  value: "TA-594"
              - column:
                  name: "TYPE"
                  value: "IMPROVED"
              - column:
                  name: "TITLE"
                  value: "Switch the dark theme on or off from your account menu"
              - column:
                  name: "DESCRIPTION"
                  value: "Click your initial in the top right corner and use the Dark theme switch, without going to Settings."
              - column:
                  name: "APPLICATION_VERSION"
                  value: "0.6.2"
              - column:
                  name: "CREATED_DATETIME"
                  valueComputed: "now()"
