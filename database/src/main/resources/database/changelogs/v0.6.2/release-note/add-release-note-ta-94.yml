databaseChangeLog:
  - changeSet:
      author: "liquibase"
      id: "add-release-note-ta-94"
      changes:
        - insert:
            tableName: "RELEASE_NOTE"
            columns:
              - column:
                  name: "ID"
                  valueSequenceNext: "release_note_sequence"
              - column:
                  name: "UUID"
                  valueComputed: "${uuid.function}"
              - column:
                  name: "TICKET"
                  value: "TA-94"
              - column:
                  name: "TYPE"
                  value: "NEW"
              - column:
                  name: "TITLE"
                  value: "Track the time you spend on tasks"
              - column:
                  name: "DESCRIPTION"
                  value: "Open a task and choose Log time to record how long you worked on it, and see the time add up on its stage and project. The project overview now also shows what the project earned per hour of work, counting supervision visits too."
              - column:
                  name: "APPLICATION_VERSION"
                  value: "0.6.2"
              - column:
                  name: "CREATED_DATETIME"
                  valueComputed: "now()"
