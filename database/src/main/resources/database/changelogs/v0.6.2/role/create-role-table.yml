databaseChangeLog:
  - changeSet:
      author: "liquibase"
      id: "create-role-table"
      changes:
        - createTable:
            tableName: "ROLE"
            columns:
              - column:
                  name: "ID"
                  type: "${long.type}"
                  constraints:
                    nullable: false
              - column:
                  name: "UUID"
                  type: "${uuid.type}"
                  constraints:
                    nullable: false
              - column:
                  name: "NAME"
                  type: "VARCHAR2(100 ${char.unit})"
                  constraints:
                    nullable: false
              # The administrator role has every permission, also the ones added later, so it stores none
              - column:
                  name: "ADMINISTRATOR"
                  type: "${boolean.type}"
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: "CREATED_DATETIME"
                  type: "TIMESTAMP"
              - column:
                  name: "LAST_MODIFIED_DATETIME"
                  type: "TIMESTAMP"
        - addPrimaryKey:
            tableName: "ROLE"
            columnNames: "ID"
            constraintName: "PK_ROLE"
  - changeSet:
      author: "liquibase"
      id: "create-role-name-unique-index"
      # H2, used to check the changelog, has no indexes on expressions
      dbms: "postgresql"
      changes:
        # Names are unique regardless of letter case, as the application checks them
        - createIndex:
            tableName: "ROLE"
            indexName: "UK_ROLE_NAME"
            unique: true
            columns:
              - column:
                  name: "lower(NAME)"
                  computed: true
