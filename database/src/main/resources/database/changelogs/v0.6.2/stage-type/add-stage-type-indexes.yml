databaseChangeLog:
  - changeSet:
      author: "liquibase"
      id: "create-stage-type-name-unique-index"
      changes:
        # Names are unique regardless of letter case, as the application checks them
        - sql:
            dbms: "postgresql"
            sql: "create unique index UK_STAGE_TYPE_NAME on STAGE_TYPE (lower(NAME))"
  - changeSet:
      author: "liquibase"
      id: "create-stage-stage-type-index"
      changes:
        - createIndex:
            tableName: "STAGE"
            indexName: "IDX_STAGE_STAGE_TYPE_ID"
            columns:
              - column:
                  name: "STAGE_TYPE_ID"
