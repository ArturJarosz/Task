databaseChangeLog:
  - changeSet:
      author: "liquibase"
      id: "replace-supplier-category-column"
      changes:
        - addColumn:
            tableName: "SUPPLIER"
            columns:
              - column:
                  name: "CATEGORY_ID"
                  type: "${long.type}"
        # Each former category value in use becomes a category named like its label ("PAINT_SHOP" -> "Paint shop"),
        # so databases with existing rows keep their data
        - sql:
            dbms: "postgresql"
            sql: >
              insert into SUPPLIER_CATEGORY (ID, UUID, NAME, CREATED_DATETIME)
              select nextval('supplier_category_sequence'), gen_random_uuid(),
                     upper(left(CATEGORY, 1)) || lower(replace(substr(CATEGORY, 2), '_', ' ')), now()
              from (select distinct CATEGORY from SUPPLIER) used_categories;
              update SUPPLIER set CATEGORY_ID = (select ID from SUPPLIER_CATEGORY
                  where NAME = upper(left(SUPPLIER.CATEGORY, 1)) || lower(replace(substr(SUPPLIER.CATEGORY, 2), '_', ' ')))
        - addNotNullConstraint:
            tableName: "SUPPLIER"
            columnName: "CATEGORY_ID"
            columnDataType: "${long.type}"
        - addForeignKeyConstraint:
            baseTableName: "SUPPLIER"
            baseColumnNames: "CATEGORY_ID"
            constraintName: "FK_SUPPLIER_SUPPLIER_CATEGORY"
            referencedTableName: "SUPPLIER_CATEGORY"
            referencedColumnNames: "ID"
        - dropColumn:
            tableName: "SUPPLIER"
            columnName: "CATEGORY"
