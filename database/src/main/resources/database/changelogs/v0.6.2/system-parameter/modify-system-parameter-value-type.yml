databaseChangeLog:
  - changeSet:
      author: "liquibase"
      id: "modify-system-parameter-value-type"
      comment: "Values such as the Google Calendar service account key, and default values such as the calendar names, are longer than 150 characters"
      changes:
        - modifyDataType:
            tableName: "SYSTEM_PARAMETER"
            columnName: "VALUE"
            newDataType: "TEXT"
        - modifyDataType:
            tableName: "SYSTEM_PARAMETER"
            columnName: "DEFAULT_VALUE"
            newDataType: "TEXT"
