databaseChangeLog:
  - changeSet:
      author: "liquibase"
      id: "create-time-entry-table"
      changes:
        - createTable:
            tableName: "TIME_ENTRY"
            columns:
              - column:
                  name: "ID"
                  type: "${long.type}"
                  constraints:
                    nullable: false
              - column:
                  name: "UUID"
                  type: "${uuid.type}"
                  constraints:
                    nullable: false
              - column:
                  name: "TASK_ID"
                  type: "${long.type}"
                  constraints:
                    nullable: false
                    foreignKeyName: "FK_TIME_ENTRY_TASK"
                    referencedTableName: "TASK"
                    referencedColumnNames: "ID"
              - column:
                  name: "ARCHITECT_ID"
                  type: "${long.type}"
                  constraints:
                    nullable: false
              - column:
                  name: "WORK_DATE"
                  type: "${date.type}"
                  constraints:
                    nullable: false
              - column:
                  name: "DURATION_MINUTES"
                  type: "${integer.type}"
                  constraints:
                    nullable: false
              - column:
                  name: "NOTE"
                  type: "VARCHAR2(255 ${char.unit})"
              - column:
                  name: "CREATED_DATETIME"
                  type: "TIMESTAMP"
              - column:
                  name: "LAST_MODIFIED_DATETIME"
                  type: "TIMESTAMP"
        - addPrimaryKey:
            tableName: "TIME_ENTRY"
            columnNames: "ID"
            constraintName: "PK_TIME_ENTRY"
