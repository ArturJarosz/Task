services:
  task-database:
    image: postgres:18.6
    container_name: task-database
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_DB=${DB_DATABASE}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      # PostgreSQL 18+ images keep data in /var/lib/postgresql/<major version>/docker, the parent directory is mounted
      - ./taskDb:/var/lib/postgresql
    networks:
      task-network:
    healthcheck:
      test: pg_isready -q -U ${DB_USER} -d ${DB_DATABASE}
      interval: 15s
      retries: 5
      start_period: 10s
      timeout: 5s
    deploy:
      resources:
        limits:
          memory: 2G

  task-schema:
    image: azjarosz/task-schema:${APP_VERSION}
    container_name: task-schema
    build:
      context: ../database
      dockerfile: database-schema.Dockerfile
      args:
        - GITHUB_MAVEN_TOKEN=${GITHUB_TOKEN}
    env_file:
      - ${ENV_FILE}
    networks:
      task-network:
    deploy:
      resources:
        limits:
          memory: 1G
    depends_on:
      task-database:
        condition: service_healthy

  task-sample-data:
    image: azjarosz/task-sample-data:${APP_VERSION}
    container_name: task-sample-data
    build:
      context: ../sample-data
      dockerfile: sample-data.Dockerfile
      args:
        - GITHUB_MAVEN_TOKEN=${GITHUB_TOKEN}
    env_file:
      - ${ENV_FILE}
    networks:
      task-network:
    deploy:
      resources:
        limits:
          memory: 1G
    depends_on:
      task-schema:
        condition: service_completed_successfully

  task-backend:
    image: azjarosz/task-backend:${APP_VERSION}
    container_name: task-backend
    build:
      context: ../core
      dockerfile: core.Dockerfile
      args:
        - GITHUB_MAVEN_TOKEN=${GITHUB_TOKEN}
    env_file:
      - ${ENV_FILE}
    networks:
      task-network:
    ports:
      - ${BACKEND_PORT}:${BACKEND_SERVER_PORT}
    deploy:
      resources:
        limits:
          memory: 2G
    depends_on:
      task-sample-data:
        condition: service_completed_successfully

  task-fe:
    image: azjarosz/task-fe:${APP_VERSION}
    container_name: task-fe
    networks:
      task-network:
    ports:
      - "${HTTPS_PORT}:443"
    env_file:
      - ${ENV_FILE}
    deploy:
      resources:
        limits:
          memory: 1G
    volumes:
      - ./ssl-cert:/home/task/ssl-cert
      - ./task-fe/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      task-backend:
        condition: service_started

networks:
  task-network:


