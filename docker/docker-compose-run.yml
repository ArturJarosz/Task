services:
  task-database:
    image: postgres:18.6
    container_name: task-database
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_DB=${DB_DATABASE}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      # PostgreSQL 18+ images keep data in /var/lib/postgresql/<major version>/docker, the parent directory is mounted
      - ./taskDb:/var/lib/postgresql
    networks:
      task-network:
    healthcheck:
      test: pg_isready -q -U ${DB_USER} -d ${DB_DATABASE}
      interval: 15s
      retries: 5
      start_period: 10s
      timeout: 5s
    deploy:
      resources:
        limits:
          memory: 2G

