server:
  port: 8002
spring:
  jpa:
    properties:
      hibernate:
        default_schema: task_schema
        dupa: sraka
        integration:
          envers:
            enabled: true
      org:
        hibernate:
          envers:
            # keeps the values of a removed record, so its history can still name it
            store_data_at_delete: true
  output:
    ansi:
      enabled: always
  datasource:
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
task:
  language: en
  encoding: UTF-8
  security:
    allowed-origins:
      - ""
